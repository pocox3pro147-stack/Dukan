<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دكانك - دكان السوكي</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d32f2f">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f8f9fa;
      padding-bottom: 140px;
    }

    /* Header & Search */
    .header {
      position: sticky;
      top: 0;
      background-color: #ffffff;
      padding: 12px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      z-index: 100;
    }

    .search-box {
      display: flex;
      align-items: center;
      background-color: #f1f3f4;
      border-radius: 24px;
      padding: 8px 16px;
    }

    .search-box input {
      border: none;
      background: transparent;
      width: 100%;
      outline: none;
      font-size: 14px;
      color: #333;
    }

    .search-icon {
      color: #5f6368;
      font-size: 18px;
      margin-left: 8px;
    }

    /* Main Container */
    .container {
      padding: 16px;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      color: #222;
      margin-bottom: 12px;
    }

    /* Categories Grid */
    .categories-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .category-card {
      background-color: #fffde7;
      border-radius: 16px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 130px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
      cursor: pointer;
      text-align: center;
    }

    .category-card:nth-child(even) {
      background-color: #f0f4c3;
    }

    .category-title {
      font-size: 13px;
      font-weight: bold;
      color: #1b5e20;
      line-height: 1.2;
    }

    .category-icon {
      font-size: 36px;
      margin-top: 8px;
    }

    /* Floating Cart Bar */
    .cart-bar {
      position: fixed;
      bottom: 65px;
      left: 16px;
      right: 16px;
      background-color: #00acc1;
      color: white;
      border-radius: 28px;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 12px rgba(0, 172, 193, 0.4);
      z-index: 99;
    }

    .cart-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cart-badge {
      background-color: #000;
      color: #fff;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }

    .cart-total {
      font-size: 16px;
      font-weight: bold;
    }

    .cart-btn {
      font-size: 16px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      border-top: 1px solid #eee;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px;
      color: #757575;
      text-decoration: none;
    }

    .nav-item.active {
      color: #00acc1;
      font-weight: bold;
    }

    .nav-icon {
      font-size: 20px;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

  <!-- Search Header -->
  <div class="header">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="ناقصك مقاضي؟ سكر، زيت، دقيق.. وأكثر">
    </div>
  </div>

  <!-- Main Content -->
  <div class="container">
    <div class="section-title">الأقسام الرئيسية</div>
    
    <div class="categories-grid">
      <div class="category-card" onclick="alert('قسم الأرز والمكرونة')">
        <div class="category-title">الارز والمكرونة والحبوب</div>
        <div class="category-icon">🌾</div>
      </div>
      
      <div class="category-card" onclick="alert('قسم مستلزمات الطبخ')">
        <div class="category-title">مستلزمات الطبخ والزيوت</div>
        <div class="category-icon">🍾</div>
      </div>

      <div class="category-card" onclick="alert('قسم الصلصات')">
        <div class="category-title">صلصات الطبخ</div>
        <div class="category-icon">🥫</div>
      </div>

      <div class="category-card" onclick="alert('قسم المعلبات')">
        <div class="category-title">المعلبات والزيوت</div>
        <div class="category-icon">🥫</div>
      </div>

      <div class="category-card" onclick="alert('قسم البهارات')">
        <div class="category-title">البهارات والتوابل</div>
        <div class="category-icon">🧂</div>
      </div>

      <div class="category-card" onclick="alert('قسم الأطعمة المجمدة')">
        <div class="category-title">الأغذية الطازجة</div>
        <div class="category-icon">🧀</div>
      </div>
    </div>
  </div>

  <!-- Floating Cart Bar -->
  <div class="cart-bar">
    <div class="cart-btn">
      <span>‹</span> عرض السلة
    </div>
    <div class="cart-info">
      <span class="cart-total">ج.س 2,500</span>
      <span class="cart-badge">2</span>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <a href="#" class="nav-item active">
      <span class="nav-icon">🛒</span>
      مقاضي
    </a>
    <a href="#" class="nav-item">
      <span class="nav-icon">📋</span>
      الطلبات
    </a>
    <a href="#" class="nav-item">
      <span class="nav-icon">👤</span>
      حسابي
    </a>
  </div>

</body>
</html>
